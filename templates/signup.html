<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - Placement-Ready AI Career Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card">
      <h1>Create your account</h1>
      <p class="muted">Takes a few seconds.</p>

      {% if error %}<p class="error-text">{{ error }}</p>{% endif %}

      <a href="/auth/google" class="google-btn">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.9 19 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4c-7.7 0-14.4 4.4-17.7 10.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.5-5.2l-6.2-5.2C29.3 35.4 26.8 36 24 36c-5.2 0-9.6-3.1-11.3-7.6l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.6l6.2 5.2C40.9 36.4 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"/>
        </svg>
        Continue with Google
      </a>

      <div class="divider"><span>or</span></div>

      <form method="post" action="/signup">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" required minlength="3" autofocus />
        </div>
        <div class="field">
          <label>Password</label>
          <div class="password-wrap">
            <input type="password" name="password" id="signupPassword" required minlength="6" />
            <button type="button" class="toggle-password" data-target="signupPassword" aria-label="Show password">👁</button>
          </div>
        </div>
        <div class="field">
          <label>Confirm password</label>
          <div class="password-wrap">
            <input type="password" name="confirm_password" id="confirmPassword" required minlength="6" />
            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Show password">👁</button>
          </div>
        </div>
        <button type="submit" class="primary-btn">Sign up</button>
      </form>

      <p class="muted auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
  <script src="/static/auth.js"></script>
</body>
</html>
