<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in - Placement-Ready AI Career Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Log in to analyze your resume.</p>

      {% if error %}<p class="error-text">{{ error }}</p>{% endif %}

      <form method="post" action="/login">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" required autofocus />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required />
        </div>
        <button type="submit" class="primary-btn">Log in</button>
      </form>

      <p class="muted auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
    </div>
  </div>
</body>
</html>
