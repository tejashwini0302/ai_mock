<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up - Placement-Ready AI Career Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="glass auth-card">
      <h1>Create your account</h1>
      <p class="muted">Takes a few seconds.</p>

      {% if error %}<p class="error-text">{{ error }}</p>{% endif %}

      <form method="post" action="/signup">
        <div class="field">
          <label>Username</label>
          <input type="text" name="username" required minlength="3" autofocus />
        </div>
        <div class="field">
          <label>Password</label>
          <input type="password" name="password" required minlength="6" />
        </div>
        <div class="field">
          <label>Confirm password</label>
          <input type="password" name="confirm_password" required minlength="6" />
        </div>
        <button type="submit" class="primary-btn">Sign up</button>
      </form>

      <p class="muted auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </div>
</body>
</html>
